async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(S),iterations:N,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(I)},key,b(C));
  return new TextDecoder().decode(buf);
}
async function go(pw,remember){
  const m=document.getElementById("m");
  if(!window.crypto||!crypto.subtle){m.textContent="Die Seite muss über https geöffnet werden.";return;}
  m.textContent="Entschlüssele ...";
  let html;
  try{ html=await unlock(pw); }
  catch(e){ m.textContent="Passwort falsch."; try{localStorage.removeItem("aw");}catch(_){} return; }
  try{ if(remember) localStorage.setItem("aw",pw); }catch(_){}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("pw").value.trim(),document.getElementById("rm").checked);});
